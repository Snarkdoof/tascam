<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tascam Player</title>
    <link rel="stylesheet" href="/static/style.css?v=14">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f1115">
    <link rel="apple-touch-icon" href="/static/icons/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- MCorp & MediaSync: Do NOT use cdn.mcorp.no (host does not exist). Use mcorp.no/lib/mcorp-2.0.js which sets window.MCorp and window.TIMINGSRC -->
    <script src="https://mcorp.no/lib/mcorp-2.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mcorp/mediasync/dist/basic-mediasync.min.js"></script>
    <script>
        window.IS_ADMIN = {{ 'true' if user and user.is_admin else 'false' }};
    </script>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="logo">Tascam<span>Flow</span></div>
                <button id="btn-install" class="btn-install hidden">Install App</button>
            </div>
            <nav class="main-nav">
                <button id="nav-repertoire" class="btn-nav active">Repertoar</button>
                <button id="nav-songs" class="btn-nav">Songs</button>
                <button id="nav-library" class="btn-nav">Library</button>
                {% if user and user.is_admin %}
                <a href="/admin" class="btn-nav" style="text-decoration: none; border-left: 1px solid var(--border); padding-left: 10px;">Admin</a>
                {% endif %}
                <a href="/logout" class="btn-nav" style="color: var(--danger); text-decoration: none;">Logout</a>
            </nav>
        </header>

        <main>
            <div id="repertoire-view" class="view">
                <div class="song-list-container">
                    <!-- Repertoires Overview (Default Start Screen) -->
                    <div id="repertoire-list-section">
                        <div class="header-row">
                            <h2>Repertoar</h2>
                            <button id="btn-new-repertoire" class="btn-primary">+ Nytt repertoar</button>
                        </div>
                        <div id="repertoire-list" class="repertoire-list">
                            <!-- Injected by JS -->
                            <div class="loading">Laster repertoar...</div>
                        </div>
                    </div>

                    <!-- Repertoire Detail -->
                    <div id="repertoire-detail-section" class="hidden">
                        <div class="detail-nav-row">
                            <button id="btn-back-to-repertoires" class="btn-secondary">← Alle repertoarer</button>
                        </div>
                        <div class="header-row detail-header">
                            <div class="rep-title-box">
                                <h2 id="rep-detail-title" class="editable" title="Klikk for å endre tittel">Repertoar</h2>
                                <p id="rep-detail-desc" class="editable text-muted" title="Klikk for å endre beskrivelse"></p>
                                <div id="rep-detail-meta" class="rep-meta-line"></div>
                            </div>
                            <div class="rep-header-actions">
                                <button id="btn-rep-play-all" class="btn-primary" title="Spill alle i rekkefølge">▶ Spill alle</button>
                                <button id="btn-rep-add-songs" class="btn-secondary" title="Gå til opptak for å legge til">+ Legg til sanger</button>
                                <button id="btn-rep-delete" class="btn-danger-outline" title="Slett repertoar">🗑 Slett</button>
                            </div>
                        </div>
                        <div id="repertoire-items-list" class="repertoire-items-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="songs-view" class="view hidden">
                <div class="song-list-container">
                    <div class="header-row">
                        <h2>Named Songs</h2>
                    </div>
                    <div id="named-song-list" class="song-list">
                        <!-- Named songs will be injected here -->
                    </div>
                </div>
            </div>

            <div id="library-view" class="view hidden">
                <div class="song-list-container">
                    <div class="header-row">
                        <div class="header-title-group">
                            <h2>Recordings</h2>
                            <div class="pause-threshold-control" title="Split into song blocks when pause between takes exceeds this duration">
                                <label for="select-pause-threshold">Pause split:</label>
                                <select id="select-pause-threshold" class="select-threshold">
                                    <option value="45">45s</option>
                                    <option value="90" selected>1.5m (90s)</option>
                                    <option value="120">2m</option>
                                    <option value="180">3m</option>
                                    <option value="300">5m</option>
                                    <option value="0">Off (flat)</option>
                                </select>
                            </div>
                        </div>
                        <div id="batch-actions" class="batch-actions hidden">
                            <button id="btn-batch-add-repertoire" class="btn-primary">📋 Legg til i repertoar (<span id="batch-rep-count">0</span>)</button>
                            <button id="btn-batch-delete" class="btn-danger">Delete Selected (<span
                                    id="selected-count">0</span>)</button>
                        </div>
                    </div>
                    <div id="song-list" class="song-list">
                        <!-- Clips will be injected here -->
                        <div class="loading">Loading library...</div>
                    </div>
                </div>
            </div>

            <div id="player-container" class="player-container">
                <div class="player-top-actions">
                    <button id="btn-mini-play-pause" class="btn-mini-play hidden" title="Play / Pause" aria-label="Play or Pause">▶</button>
                    <button id="btn-toggle-player" class="btn-toggle-player" title="Minimize player" aria-label="Minimize player" aria-expanded="true">▼</button>
                </div>
                <div class="now-playing-info">
                    <h3 id="np-title">Select a track</h3>
                    <p id="np-artist">...</p>
                    <div id="np-tags" class="tag-list"></div>
                </div>

                <div class="player-visual">
                    <audio id="audio-player" preload="auto"></audio>
                    <div class="custom-progress">
                        <div id="progress-bar" class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                            <div id="marker-track" class="marker-track"></div>
                        </div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">00:00</span> / <span id="total-time">00:00</span>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="main-controls-row">
                        <button id="btn-begin" title="Start from beginning">⏮</button>
                        <button id="btn-skip-back" title="Skip back to start of segment">⏪</button>
                        <button id="btn-rewind-3s" title="Back 3s">↺</button>
                        <button id="btn-play-pause" class="btn-primary" title="Play / Pause">▶</button>
                    </div>
                    
                    <div id="loop-controls" class="loop-controls">
                        <!-- Loop options injected by JS -->
                    </div>

                    <div class="marker-btns">
                        <input type="text" id="marker-val" placeholder="Label (e.g. A, Bar 16)">
                        <button id="btn-add-marker" class="btn-secondary">Add Marker</button>
                    </div>
                </div>

                <div class="marker-list-container">
                    <div class="marker-header">
                        <h4>Markers</h4>
                        <button id="btn-toggle-markers" class="btn-icon">▼</button>
                    </div>
                    <div id="marker-list" class="marker-list">
                        <!-- Markers will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Nytt Repertoar -->
    <div id="modal-new-repertoire" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nytt Repertoar</h3>
                <button class="modal-close" id="btn-close-new-rep-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="input-rep-name">Navn på repertoar</label>
                    <input type="text" id="input-rep-name" placeholder="F.eks. Sommerturné 2026, Akustisk sett..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="input-rep-desc">Beskrivelse (valgfritt)</label>
                    <input type="text" id="input-rep-desc" placeholder="F.eks. Låter til øving torsdager" autocomplete="off">
                </div>
                {% if user and user.is_admin %}
                <div class="form-group form-check">
                    <label>
                        <input type="checkbox" id="input-rep-private">
                        <span>Privat (kun synlig for admin)</span>
                    </label>
                </div>
                {% endif %}
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-new-rep" class="btn-secondary">Avbryt</button>
                <button id="btn-create-rep-submit" class="btn-primary">Opprett</button>
            </div>
        </div>
    </div>

    <!-- Modal: Legg til i repertoar -->
    <div id="modal-add-to-repertoire" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="add-to-rep-title">Legg til i repertoar</h3>
                <button class="modal-close" id="btn-close-add-to-rep-modal">×</button>
            </div>
            <div class="modal-body">
                <p id="add-to-rep-subtitle" class="text-secondary" style="margin-bottom: 15px;"></p>
                <div id="add-to-rep-options" class="rep-select-list">
                    <!-- Populated dynamically with repertoires -->
                </div>
                <div class="modal-divider">eller</div>
                <button id="btn-modal-open-create-rep" class="btn-secondary full-width">+ Opprett nytt repertoar</button>
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-add-to-rep" class="btn-secondary">Lukk</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/app.js?v=11"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered with scope:', registration.scope))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
